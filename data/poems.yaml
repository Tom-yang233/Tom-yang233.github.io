# 野生小诗 —— 本地诗词库
# 每次刷新主页随机展示一首

- content: 须信百年俱是梦，天地阔，且徜徉。
  author: 苏轼
  origin: 江城子

- content: 采菊东篱下，悠然见南山。
  author: 陶渊明
  origin: 饮酒·其五

- content: 日暮苍山远，天寒白屋贫。
  author: 刘长卿
  origin: 逢雪宿芙蓉山主人

- content: 不识庐山真面目，只缘身在此山中。
  author: 苏轼
  origin: 题西林壁

- content: 何当共剪西窗烛，却话巴山夜雨时。
  author: 李商隐
  origin: 夜雨寄北

- content: 竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。
  author: 苏轼
  origin: 定风波

- content: 世事一场大梦，人生几度秋凉。
  author: 苏轼
  origin: 西江月

- content: 小舟从此逝，江海寄余生。
  author: 苏轼
  origin: 临江仙

- content: 料峭春风吹酒醒，微冷，山头斜照却相迎。
  author: 苏轼
  origin: 定风波

- content: 然而几人真得鹿，不知终日梦为鱼。
  author: 黄庭坚
  origin: 杂诗·其一

- content: 溪柴火软蛮毡暖，我与狸奴不出门。
  author: 陆游
  origin: 十一月四日风雨大作二首·其一

- content: 寄身虽在远，发兴自不孤。
  author: 柳宗元
  origin: 构法华寺敢嘉木二十株于西崖下篇

- content: 你来人间一趟。你要看看太阳。
  author: 海子
  origin: 夏天的太阳

- content: 宁作我，岂其卿。人间走遍却归耕。
  author: 苏轼
  origin: 鹧鸪天·自适

- content: 身外闲愁空满，眼中欢事常稀。
  author: 晏几道
  origin: 临江仙

- content: 自是人生常恨水常东。
  author: 李煜
  origin: 相见欢

- content: 人生如逆旅，我亦是行人。
  author: 苏轼
  origin: 临江仙

- content: 水无定。花有尽。会相逢。可是人生长在别离中。
  author: 向子諲
  origin: 相见欢

- content: 唯见月寒日暖，来煎人寿。
  author: 李煜
  origin: 苦昼短

- content: 我有三次受难：流浪、爱情、生存。
  author: 海子
  origin: 夜色

- content: 我又三种幸福：诗歌、王位、太阳。
  author: 海子
  origin: 夜色

- content: 远方只有死亡中凝聚野花一片，明月如镜高悬在草原映照千年的岁月。
  author: 海子
  origin: 九月

- content: 风后面是风/天空上面是天空/道路前面还是道路
  author: 海子
  origin: 四姐妹